services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

  demo:
    build: ./backend
    command: streamlit run demo/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - backend
